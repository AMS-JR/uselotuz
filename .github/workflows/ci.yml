name: Frontend checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build:inventory
      - run: pnpm build:workspace
      - run: pnpm --filter @uselotuz/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:inventory
      - run: pnpm test:workspace
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lotuz_tests
          POSTGRES_USER: lotuz_test
          POSTGRES_PASSWORD: ci_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lotuz_test -d lotuz_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/lotuz_tests
      TEST_DATABASE_USER: lotuz_test
      TEST_DATABASE_PASSWORD: ci_test_only
      TEST_MIGRATIONS: "true"
      TEST_DDL: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x backend/mvnw
      - run: ./mvnw -B verify
        working-directory: backend
