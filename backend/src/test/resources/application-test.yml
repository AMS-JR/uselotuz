spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:h2:mem:lotuz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${TEST_DATABASE_USER:sa}
    password: ${TEST_DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${TEST_DDL:create-drop}
  flyway:
    enabled: ${TEST_MIGRATIONS:false}
lotuz:
  frontend-url: http://localhost:3001
logging:
  level:
    root: WARN
